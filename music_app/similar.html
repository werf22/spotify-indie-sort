<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Similar Tracks</title>
<style>
  :root { --bg:#12131a; --panel:#1b1d27; --line:#2a2d3a; --ink:#e6e7ee; --dim:#8f93a8;
          --accent:#6d8cff; --green:#1db954; }
  * { box-sizing:border-box; }
  body { margin:0 0 118px; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:14px 18px; background:var(--panel); border-bottom:1px solid var(--line);
           position:sticky; top:0; z-index:10; }
  h1 { margin:0 0 10px; font-size:17px; font-weight:650; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input, select, button { background:#232636; color:var(--ink); border:1px solid var(--line);
           border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit; }
  input:focus { outline:2px solid var(--accent); }
  button { cursor:pointer; } button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.spotify { background:var(--green); color:#04150b; border-color:var(--green); font-weight:600; }
  #hits { margin-top:8px; display:none; background:#232636; border:1px solid var(--line);
          border-radius:8px; max-height:250px; overflow:auto; }
  #hits div { padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--line); }
  #hits div:hover { background:#2b2f42; } #hits .no { color:var(--dim); }
  #ref { margin-top:10px; color:var(--dim); } #ref b { color:var(--ink); }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase;
       letter-spacing:.5px; position:sticky; top:0; background:var(--bg); }
  tr:hover td { background:#191c28; } tr.playing td { background:#1e2438; }
  tr.playing td:first-child { box-shadow:inset 3px 0 0 var(--accent); }
  td.num { color:var(--dim); width:38px; }
  .bar { height:5px; background:#2a2d3a; border-radius:3px; width:70px; display:inline-block; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  .why { color:var(--dim); font-size:12px; }
  .play { padding:3px 10px; border-radius:6px; font-size:13px; }
  /* ---- player ---- */
  #player-bar { position:fixed; left:0; right:0; bottom:0; background:var(--panel);
                border-top:1px solid var(--line); padding:10px 18px; z-index:40; }
  #player-bar .top { display:flex; gap:14px; align-items:center; }
  #now { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #now small { color:var(--dim); }
  .ctl { background:none; border:none; color:var(--ink); font-size:19px; padding:4px 9px; }
  .ctl:hover { color:var(--accent); }
  #big { background:var(--accent); color:#0b0d14; border-radius:50%; width:40px; height:40px;
         font-size:16px; display:flex; align-items:center; justify-content:center; padding:0; border:none; }
  #seek, #vol { -webkit-appearance:none; height:6px; border-radius:3px; background:#2a2d3a; padding:0; border:none; }
  #seek { flex:1; } #vol { width:90px; }
  #seek::-webkit-slider-thumb, #vol::-webkit-slider-thumb { -webkit-appearance:none;
      width:13px; height:13px; border-radius:50%; background:var(--accent); cursor:pointer; }
  .times { display:flex; gap:10px; align-items:center; margin-top:7px; color:var(--dim); font-variant-numeric:tabular-nums; }
  #toast { position:fixed; bottom:130px; left:50%; transform:translateX(-50%); background:#232636;
           border:1px solid var(--accent); padding:10px 18px; border-radius:8px; display:none; z-index:60; }
  #toast a { color:var(--accent); }
  .muted { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Nájdi podobné tracky</h1>
  <div class="row">
    <input id="q" placeholder="Napíš interpreta alebo názov…" style="width:330px" autofocus>
    <select id="limit"><option value="100" selected>100</option><option value="50">50</option>
      <option value="200">200</option><option value="500">500</option></select>
    <label class="muted"><input type="checkbox" id="spotifyOnly" checked> len zo Spotify</label>
    <label class="muted"><input type="checkbox" id="sameKey"> rovnaká tónina</label>
    <label class="muted">BPM ±<input id="bpm" type="number" value="0" min="0" max="20" style="width:60px"> %</label>
    <button id="make" class="spotify" disabled>Vytvor Spotify playlist</button>
    <input id="plname" placeholder="Názov playlistu" style="width:220px">
  </div>
  <div id="hits"></div>
  <div id="ref"></div>
</header>

<table><thead><tr>
  <th class="num">#</th><th>Interpret</th><th>Track</th><th>Zhoda</th>
  <th>Prečo</th><th>BPM</th><th>Tónina</th><th></th>
</tr></thead><tbody id="body"></tbody></table>

<div id="player-bar">
  <div class="top">
    <button class="ctl" id="prev" title="Predchádzajúci">⏮</button>
    <button id="big" title="Prehrať / pauza (medzerník)">▶</button>
    <button class="ctl" id="next" title="Ďalší">⏭</button>
    <div id="now"><small>nič sa nehrá</small></div>
    <span class="muted">🔊</span><input id="vol" type="range" min="0" max="1" step="0.01" value="1">
  </div>
  <div class="times">
    <span id="cur">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1">
    <span id="dur">0:00</span>
    <span id="status" class="muted" style="margin-left:10px"></span>
    <span id="embed" style="margin-left:auto"></span>
  </div>
</div>

<audio id="player"></audio>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const P = $("player");
const state = { rows: [], index: -1 };
const esc = s => (s||"").replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const mmss = s => (!isFinite(s) || s < 0) ? "0:00"
  : Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
const toast = (html, ms=8000) => { const t=$("toast"); t.innerHTML=html; t.style.display="block";
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display="none", ms); };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({error:"server neodpovedal JSONom"}));
  if (j.error) throw new Error(j.error);
  return j;
}

async function pollReady() {
  try {
    const s = await api("/api/similar/status");
    if (s.error) { $("status").textContent = "Chyba: " + s.error; return; }
    if (s.ready) { $("status").textContent = `${s.tracks.toLocaleString()} zanalyzovaných`; return; }
    $("status").textContent = "načítavam odtlačky… (~1 min, raz za spustenie)";
  } catch { $("status").textContent = "server nedostupný"; }
  setTimeout(pollReady, 2000);
}

let timer;
$("q").oninput = () => { clearTimeout(timer); timer = setTimeout(doSearch, 250); };
async function doSearch() {
  const q = $("q").value.trim();
  if (q.length < 2) { $("hits").style.display = "none"; return; }
  const { results } = await api("/api/similar/search?q=" + encodeURIComponent(q));
  $("hits").innerHTML = results.length ? results.map(r =>
    `<div data-id="${r.spotify_id}" class="${r.analysed===false?'no':''}">${esc(r.artist)} — ${esc(r.title)}${
      r.analysed===false?' · zatiaľ bez analýzy':''}</div>`).join("") : '<div class="no">nič</div>';
  $("hits").style.display = "block";
  $("hits").querySelectorAll("div[data-id]").forEach(el =>
    el.onclick = () => pick(el.dataset.id, el.textContent.trim()));
}

async function pick(id, label) {
  $("hits").style.display = "none";
  $("q").value = label.replace(/ · zatiaľ bez analýzy$/, "");
  $("ref").innerHTML = "hľadám podobné k <b>" + esc($("q").value) + "</b> …";
  $("body").innerHTML = ""; $("make").disabled = true;
  const params = new URLSearchParams({ id, limit:$("limit").value,
    spotify_only: $("spotifyOnly").checked?"1":"0", same_key: $("sameKey").checked?"1":"0",
    bpm_window: $("bpm").value || "0" });
  try {
    const { results } = await api("/api/similar?" + params);
    state.rows = results; render();
    $("ref").innerHTML = `<b>${esc($("q").value)}</b> — ${results.length} najpodobnejších`;
    $("plname").value = "Podobné na " + $("q").value;
    $("make").disabled = !results.length;
  } catch (e) { $("ref").innerHTML = '<span style="color:#ff8080">'+esc(e.message)+'</span>'; }
}

function render() {
  const max = state.rows.length ? state.rows[0].score : 1;
  $("body").innerHTML = state.rows.map((r,i) => {
    const w = r.why || {};
    const why = [ w.key===1 ? "tónina" : (w.key>=0.6 ? "mixovateľná" : null),
                  w.bpm_diff!=null && w.bpm_diff<=2 ? "BPM" : null,
                  w.tags>=0.4 ? "tagy" : null,
                  w.rhythm>-1 ? "rytmus" : null ].filter(Boolean).join(" · ");
    return `<tr data-i="${i}">
      <td class="num">${i+1}</td><td>${esc(r.artist)}</td><td>${esc(r.title)}</td>
      <td><span class="bar"><i style="width:${Math.max(4,Math.round(r.score/max*100))}%"></i></span></td>
      <td class="why">${why||"&nbsp;"}</td>
      <td class="muted">${r.bpm ?? ""}</td><td class="muted">${esc(r.key||"")}</td>
      <td><button class="play">${r.has_file ? "▶" : "▶ Spotify"}</button></td></tr>`;
  }).join("");
  $("body").querySelectorAll("tr").forEach(tr =>
    tr.querySelector(".play").onclick = () => playIndex(+tr.dataset.i));
}

function playIndex(i) {
  if (i < 0 || i >= state.rows.length) return;
  state.index = i;
  const r = state.rows[i];
  document.querySelectorAll("tr.playing").forEach(e => e.classList.remove("playing"));
  const tr = $("body").querySelector(`tr[data-i="${i}"]`);
  if (tr) { tr.classList.add("playing"); tr.scrollIntoView({block:"nearest"}); }
  $("now").innerHTML = `${esc(r.artist)} — ${esc(r.title)}<br><small>${r.bpm??"?"} BPM · ${esc(r.key||"?")}</small>`;
  if (r.has_file) {
    $("embed").innerHTML = "";
    P.src = "/api/audio?id=" + encodeURIComponent(r.spotify_id);
    P.play().then(()=> $("big").textContent = "❚❚").catch(()=> showEmbed(r.spotify_id));
  } else showEmbed(r.spotify_id);
}

function showEmbed(id) {
  P.pause(); $("big").textContent = "▶";
  $("embed").innerHTML = `<iframe src="https://open.spotify.com/embed/track/${id}"
      width="300" height="80" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
}

$("big").onclick = () => {
  if (!P.src) { playIndex(0); return; }
  if (P.paused) { P.play(); $("big").textContent = "❚❚"; }
  else { P.pause(); $("big").textContent = "▶"; }
};
$("prev").onclick = () => playIndex(state.index - 1);
$("next").onclick = () => playIndex(state.index + 1);
P.onended = () => playIndex(state.index + 1);          // straight into the next one
P.onpause = () => $("big").textContent = "▶";
P.onplay  = () => $("big").textContent = "❚❚";

// Seek bar. `seeking` stops the timeupdate handler fighting the user's drag.
let seeking = false;
P.ontimeupdate = () => {
  if (seeking || !isFinite(P.duration)) return;
  $("seek").value = Math.round(P.currentTime / P.duration * 1000);
  $("cur").textContent = mmss(P.currentTime);
};
P.onloadedmetadata = () => { $("dur").textContent = mmss(P.duration); $("seek").value = 0; };
$("seek").oninput = () => { seeking = true; $("cur").textContent = mmss($("seek").value/1000*P.duration); };
$("seek").onchange = () => { if (isFinite(P.duration)) P.currentTime = $("seek").value/1000*P.duration;
                             seeking = false; };
$("vol").oninput = () => P.volume = +$("vol").value;

document.onkeydown = e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;   // never steal typing
  if (e.code === "Space") { e.preventDefault(); $("big").click(); }
  else if (e.code === "ArrowRight") P.currentTime = Math.min(P.duration||0, P.currentTime + 10);
  else if (e.code === "ArrowLeft")  P.currentTime = Math.max(0, P.currentTime - 10);
  else if (e.code === "ArrowDown")  { e.preventDefault(); playIndex(state.index + 1); }
  else if (e.code === "ArrowUp")    { e.preventDefault(); playIndex(state.index - 1); }
};

$("make").onclick = async () => {
  $("make").disabled = true; $("status").textContent = "vytváram playlist…";
  try {
    const res = await api("/api/playlist", { method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ name: $("plname").value || "Similar tracks",
        description: "Z lokálnej hudobnej databázy podľa audio podobnosti, tagov, rytmu a tóniny.",
        ids: state.rows.map(r => r.spotify_id) }) });
    $("status").textContent = `hotovo — ${res.added}`;
    toast(`Playlist vytvorený (${res.added} trackov)${res.skipped?`, ${res.skipped} preskočených`:""} — `
        + `<a href="${res.url}" target="_blank">otvoriť na Spotify</a>`, 15000);
  } catch (e) { $("status").textContent=""; toast("Nepodarilo sa: " + esc(e.message), 10000); }
  $("make").disabled = false;
};
pollReady();
</script>
</body>
</html>
