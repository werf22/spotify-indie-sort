[package]
name = "onetagger-db"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1.0"
onetagger-platforms = { path = "../vendor/onetagger/crates/onetagger-platforms" }
onetagger-tagger = { path = "../vendor/onetagger/crates/onetagger-tagger" }
onetagger-tag = { path = "../vendor/onetagger/crates/onetagger-tag" }
